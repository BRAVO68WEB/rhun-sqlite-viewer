# SQLite viewer for rhun. Installed at ~/.config/rhun/extensions/BRAVO68WEB/rhun-sqlite-viewer/.
name = rhun-sqlite-viewer
owner = BRAVO68WEB
title = SQLite
description = Browse a SQLite database, run SQL, and edit rows. Save writes the file back.
icon = icon.png
color = #0b6e4f
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/rhun-sqlite-viewer-linux-x86_64
run.macos-arm64 = bin/rhun-sqlite-viewer-macos-arm64
run.windows-x64 = bin/rhun-sqlite-viewer-windows-x64.exe
on = command

[commands]
run = SQLite: Run SQL
refresh = SQLite: Refresh Schema
insert = SQLite: New Row
delete = SQLite: Delete Row
undo = SQLite: Undo
redo = SQLite: Redo

[keys]
ctrl+shift+Enter = run when editorFocus || viewFocus

[menu.editor]
run.when = resourceExt in '.sql .psql .ddl .sqlite .sqlite3 .db .sdb .db3'
refresh.when = resourceExt in '.sqlite .sqlite3 .db .sdb .db3'
insert.when = resourceExt in '.sqlite .sqlite3 .db .sdb .db3'
delete.when = resourceExt in '.sqlite .sqlite3 .db .sdb .db3'

[subscribe]
opened = *.sql *.psql *.ddl

[provides]
editor = *.sqlite *.sqlite3 *.db *.sdb *.db3
editor.title = SQLite
editor.model = owned
editor.priority = default

[views]
schema.title = Tables
schema.place = sidebar
schema.kind = tree
schema.open = yes
sql.title = SQL
sql.place = panel
sql.kind = form
results.title = Results
results.place = panel
results.kind = table
results.open = yes
row.title = Statement
row.place = side
row.kind = form

[needs]
documents = read
project = read
home = none
network = no
