# Lint and test on the three systems rhun runs on; the conformance checker and the headless test
# against the latest rhun on Linux.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Conformance checker
        run: sh tests/check.sh
      - name: rhun
        run: curl -fsSL https://github.com/vshvedov/rhun/releases/latest/download/install.sh | sh
      - name: Headless test
        run: |
          v=$("$HOME/.local/bin/rhun" --version | sed 's/^rhun //')
          case "$v" in 0.[0-9].*|0.1[0-7].*) echo "rhun $v has no extensions: the headless test needs 0.18.0"; exit 0 ;; esac
          sh tests/run.sh "$HOME/.local/bin/rhun"
